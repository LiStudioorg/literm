name: Build Release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Release 自动签名：keystore 以 base64 形式存放在仓库 Secrets 中。
      # 未配置 KEYSTORE_BASE64 时跳过解码，Gradle 会回退到 debug 签名，构建仍然可用。
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::secrets.KEYSTORE_BASE64 未配置，跳过 release keystore 解码（回退 debug 签名）"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          ls -l app/release.keystore

      - name: Build release APK (with log capture)
        id: build
        shell: bash
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          set -x
          ./gradlew assembleRelease --stacktrace --info 2>&1 | tee build_log.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::group::assembleRelease errors (grep)"
            grep -n "e: \|FAILURE:\|Task .* FAILED\|BUILD FAILED\|What went wrong\|Execution failed\|Unresolved reference\|Overload resolution\|Could not (resolve|find)\|A problem occurred" build_log.txt | head -n 200 || true
            echo "::endgroup::"
            echo "::group::assembleRelease failure (tail 600)"
            tail -n 600 build_log.txt || true
            echo "::endgroup::"
            python3 - <<'PY' || true
          import re, pathlib
          p = pathlib.Path('build_log.txt')
          if not p.exists(): raise SystemExit
          text = p.read_text(errors='ignore').splitlines()
          pat = re.compile(r'(e:\s+file:|FAILURE:|BUILD FAILED|What went wrong:|Execution failed for task|Unresolved reference|Overload resolution|Could not (resolve|find)|Task .* FAILED)')
          keys = []
          for i, l in enumerate(text):
              if pat.search(l):
                  keys.extend(text[max(0, i - 1):min(len(text), i + 5)])
          seen = set(); out = []
          for l in keys:
              if l not in seen:
                  seen.add(l); out.append(l)
          for l in out[:60]:
              esc = l.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error title=build::{esc[:300]}")
          PY
          fi
          exit 0

      - name: Verify single universal APK
        if: steps.build.outputs.status == '0'
        run: |
          ls -l app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('app/build/outputs/apk/release/app-release.apk')
          abis = sorted({n.split('/')[1] for n in z.namelist() if n.startswith('lib/') and '/' in n})
          print('APK ABIs:', abis)
          assert 'arm64-v8a' in abis and 'x86_64' in abis, 'universal APK 缺少预期 ABI'
          PY

      - name: Rename universal APK
        if: steps.build.outputs.status == '0'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/LiTerm-Universal.apk

      - name: Upload release APKs
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: LiTerm-Universal
          path: dist/LiTerm-Universal.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build.outputs.status != '0'
        run: |
          echo "assembleRelease failed with status ${{ steps.build.outputs.status }}"
          exit 1
